# Optional local development overlays.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Keeps infra ports published and adds slightly more verbose logging for debugging.

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_INITDB_ARGS: "--data-checksums"

  redpanda:
    environment:
      REDPANDA_LOG_LEVEL: debug

  grafana:
    environment:
      GF_LOG_LEVEL: info
      GF_USERS_DEFAULT_THEME: dark
