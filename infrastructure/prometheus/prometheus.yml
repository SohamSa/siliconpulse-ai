global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: siliconpulse-ai
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # Application scrapes land in later phases when services expose /metrics
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
        labels:
          service: redpanda

  # API scrape enabled in Phase 5 when /metrics exists.
  # Uncomment then:
  # - job_name: siliconpulse-api
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["host.docker.internal:8000"]

