# SiliconPulse AI — local infrastructure (Phase 2)
# Usage: cp .env.example .env && docker compose up -d
# App services (api/web/simulator) join in later phases.

name: siliconpulse-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15
    container_name: sp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siliconpulse}
      POSTGRES_USER: ${POSTGRES_USER:-siliconpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siliconpulse_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siliconpulse} -d ${POSTGRES_DB:-siliconpulse}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [siliconpulse]
    logging: *default-logging

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: sp-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [siliconpulse]
    logging: *default-logging

  redpanda:
    # Docker Hub mirror — docker.redpanda.com can time out on some networks
    image: redpandadata/redpanda:v24.3.1
    container_name: sp-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --default-log-level=info
    ports:
      - "19092:19092"   # Kafka API (host)
      - "18081:18081"   # Schema Registry (host)
      - "18082:18082"   # Pandaproxy (host)
      - "9644:9644"     # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [siliconpulse]
    logging: *default-logging

  redpanda-init:
    image: redpandadata/redpanda:v24.3.1
    container_name: sp-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      REDPANDA_BROKERS: redpanda:9092
    volumes:
      - ./infrastructure/redpanda/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"
    networks: [siliconpulse]
    logging: *default-logging

  redpanda-console:
    image: redpandadata/console:v2.8.0
    container_name: sp-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      CONFIG_FILEPATH: /etc/redpanda/console-config.yml
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/redpanda/console-config.yml:/etc/redpanda/console-config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/admin/startup || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [siliconpulse]
    logging: *default-logging

  minio:
    image: minio/minio:latest
    container_name: sp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [siliconpulse]
    logging: *default-logging

  minio-init:
    image: minio/mc:latest
    container_name: sp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/create-buckets.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_dev_password}
      MINIO_BUCKET_RAW_TELEMETRY: ${MINIO_BUCKET_RAW_TELEMETRY:-raw-telemetry}
      MINIO_BUCKET_PROCESSED_TELEMETRY: ${MINIO_BUCKET_PROCESSED_TELEMETRY:-processed-telemetry}
      MINIO_BUCKET_TRAINING: ${MINIO_BUCKET_TRAINING:-training-datasets}
      MINIO_BUCKET_MODELS: ${MINIO_BUCKET_MODELS:-ml-models}
      MINIO_BUCKET_EVAL: ${MINIO_BUCKET_EVAL:-evaluation-reports}
      MINIO_BUCKET_REPORTS: ${MINIO_BUCKET_REPORTS:-incident-reports}
      MINIO_BUCKET_FIRMWARE: ${MINIO_BUCKET_FIRMWARE:-firmware-artifacts}
      MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS:-exports}
    volumes:
      - ./infrastructure/minio/create-buckets.sh:/scripts/create-buckets.sh:ro
    restart: "no"
    networks: [siliconpulse]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sp-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [siliconpulse]
    logging: *default-logging

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: sp-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [siliconpulse]
    logging: *default-logging

  telemetry-generator:
    build:
      context: .
      dockerfile: services/telemetry-generator/Dockerfile
    container_name: sp-telemetry-generator
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      SIM_DEVICE_COUNT: ${SIM_DEVICE_COUNT:-50}
      SIM_RACK_COUNT: ${SIM_RACK_COUNT:-5}
      SIM_EMIT_INTERVAL_MS: ${SIM_EMIT_INTERVAL_MS:-1000}
      SIM_SEED: ${SIM_SEED:-42}
      SIM_SPEED_MULTIPLIER: ${SIM_SPEED_MULTIPLIER:-1.0}
      SIM_DEFAULT_DEVICE_ID: ${SIM_DEFAULT_DEVICE_ID:-GPU-042}
      SIM_PUBLISH_ENABLED: "true"
      REDPANDA_BROKERS: redpanda:9092
      SIM_CONTROL_HOST: 0.0.0.0
      SIM_CONTROL_PORT: 8100
    ports:
      - "${SIM_CONTROL_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s
    networks: [siliconpulse]
    logging: *default-logging

networks:
  siliconpulse:
    name: siliconpulse-net
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  redpanda_data:
  minio_data:
  prometheus_data:
  grafana_data:
