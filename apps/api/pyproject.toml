[project]
name = "siliconpulse-api"
version = "0.1.0"
description = "SiliconPulse FastAPI application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "shared-models",
  "shared-events",
  "shared-db",
  "shared-observability",
  "shared-security",
  "shared-utils",
]

[tool.uv.sources]
shared-models = { workspace = true }
shared-events = { workspace = true }
shared-db = { workspace = true }
shared-observability = { workspace = true }
shared-security = { workspace = true }
shared-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


