[project]
name = "telemetry-generator"
version = "0.1.0"
description = "SiliconPulse configurable telemetry simulator"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "kafka-python>=2.0.2,<3",
  "prometheus-client>=0.21,<1",
  "shared-models",
  "shared-events",
  "shared-observability",
  "shared-utils",
]

[project.scripts]
telemetry-generator = "telemetry_generator.main:run"

[tool.uv.sources]
shared-models = { workspace = true }
shared-events = { workspace = true }
shared-observability = { workspace = true }
shared-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
