[project]
name = "shared-db"
version = "0.1.0"
description = "SiliconPulse shared database utilities and SQLAlchemy base"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


