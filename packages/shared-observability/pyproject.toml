[project]
name = "shared-observability"
version = "0.1.0"
description = "SiliconPulse logging, metrics, and OpenTelemetry helpers"
requires-python = ">=3.12"
dependencies = [
  "structlog>=24.4,<26",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


