[project]
name = "shared-security"
version = "0.1.0"
description = "SiliconPulse auth helpers, password hashing, and RBAC primitives"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "passlib[bcrypt]>=1.7,<2",
  "python-jose[cryptography]>=3.3,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


